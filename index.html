<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#b6ff00">
    <meta name="description" content="Привіт Славік від Тараса.">
    <title>Привіт Славік від Тараса</title>
    <style>
      :root { color-scheme: light; background: #b6ff00; color: #000; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        padding: clamp(24px, 5vw, 80px);
        display: flex;
        flex-direction: column;
        font-family: Arial, Helvetica, sans-serif;
      }
      main { flex: 1; display: flex; align-items: center; padding-block: 48px; }
      h1 {
        margin: 0;
        font-size: clamp(48px, 10.8vw, 168px);
        font-weight: 900;
        line-height: .95;
        letter-spacing: -.065em;
      }
      h1 span { display: block; }
      footer { padding-top: 20px; border-top: 1px solid #000; }
      figure { margin: 0; font-size: 13px; line-height: 1.5; }
      blockquote { margin: 0 0 5px; }
      figcaption { font-size: 11px; }
      a { color: inherit; text-underline-offset: 3px; }
      a:hover { text-decoration-thickness: 2px; }
      a:focus-visible { outline: 2px solid #000; outline-offset: 5px; }
      ::selection { background: #000; color: #b6ff00; }
    </style>
  </head>
  <body>
    <main>
      <h1><span>Привіт Славік</span><span>від Тараса.</span></h1>
    </main>
    <footer>
      <figure>
        <blockquote>«Треба не вважати себе кимсь, а ним бути».</blockquote>
        <figcaption>— <a href="https://www.radiosvoboda.org/a/1113488.html">Лесь Подерв’янський</a></figcaption>
      </figure>
    </footer>
  </body>
</html>
